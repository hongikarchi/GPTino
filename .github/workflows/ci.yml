name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-stage:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/panel/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.422
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Verify repository safety boundary
        run: dotnet run --project tools/GPTino.DevLoop/GPTino.DevLoop.csproj --configuration Release -- verify --stage boundary
      # The PythonStructuralSolver tests run the real solver.py against the runner's Python (no
      # Rhino py39 here, so it falls back to PATH python). They validate against closed-form beam
      # theory, so installing the real engine keeps that coverage live in CI instead of skipping it.
      - name: Install the structural solver runtime (PyNiteFEA)
        run: python -m pip install --disable-pip-version-check PyNiteFEA
      - name: Build panel, validate .NET, and stage one package
        shell: pwsh
        run: ./scripts/build-package.ps1
      - name: Upload validated Yak staging archive
        uses: actions/upload-artifact@v4
        with:
          name: GPTino-yak-stage
          path: |
            artifacts/GPTino-*-yak-stage.zip
            artifacts/GPTino-*-yak-stage-contents.txt
          if-no-files-found: error
          retention-days: 7
